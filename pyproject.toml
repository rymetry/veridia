[project]
name = "veridia"
version = "0.0.0"
description = "QAエージェントプラットフォーム(North Star: docs/qa-agent-strategy.md)の実装リポジトリ"
requires-python = ">=3.12"
# 正本はschemas/*.schema.json(ADR-0002)。Pydanticはコード側の型付き表現、
# jsonschemaは生JSON artifactのcontract検証(T-008 validatorの中核)。
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.21,<5",
    # referencingはjsonschemaの推移的依存だが、$ref解決のRegistryを直接importする
    # (schemas/README.mdの規約・tests)ため明示宣言する
    "referencing>=0.31,<1",
    # pyyamlはsqk-core SKILL.mdのfrontmatterをruntimeでパースする(skill_runner)。
    # T-021時点の「実行時利用が必要になったら本体依存へ昇格する」に該当したため昇格した。
    "pyyaml>=6,<7",
]

[dependency-groups]
# 開発用ツール。uvのdependency-group機能で管理する(PEP 735)。
# schema→Pydantic生成(datamodel-code-generator)はADR-0008で廃止した。
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.5,<1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "artifact_validator",
    "change_impact_generator",
    "evidence_store",
    "gate_evaluator",
    "sandbox_runner",
    "sandbox_env",
    "scripts",
    "run_store",
    "skill_runner",
    "source_connector",
    "test_asset_index_generator",
    "tests",
    "tool_gateway",
    "trace_store",
    "trace_ids",
]
# vendor/ は外部リポジトリのsubmodule(ADR-0006)。原本を書き換えないためlint/format対象外。
extend-exclude = ["vendor"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import順, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." はリポジトリルート(artifact_validator / tool_gateway 等のトップレベルパッケージを解決する)。
# tests/__init__.py の有無やimport-modeに依存させない明示指定。
pythonpath = ["scripts", "."]
addopts = "-ra"

[tool.uv]
# requires-python>=3.12を満たす管理Pythonをuvが自動取得する(uv python install不要)。
package = false
